<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Video Player</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
  background: #0d1117;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: "Poppins", sans-serif;
}

.video-container {
  position: relative;
  width: 80%;
  max-width: 800px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
}

video {
  width: 100%;
  display: block;
}

.controls {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  padding: 10px;
  gap: 10px;
  transition: opacity 0.3s;
}

.btn {
  background: none;
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
  transition: transform 0.2s;
}

.btn:hover {
  transform: scale(1.2);
}

input[type="range"] {
  flex-grow: 1;
  cursor: pointer;
}

  </style>
</head>
<body>
  <div class="video-container">
    <video id="video" src="Recording 2025-10-20 171148.mp4"></video>

    <div class="controls">
      <button id="play-pause" class="btn">▶</button>
      <input type="range" id="progress" value="0" min="0" max="100">
      <button id="mute" class="btn">🔊</button>
      <input type="range" id="volume" value="1" min="0" max="1" step="0.1">
      <button id="fullscreen" class="btn">⛶</button>
    </div>
  </div>

  <script >
    const video = document.getElementById("video");
const playPause = document.getElementById("play-pause");
const progress = document.getElementById("progress");
const mute = document.getElementById("mute");
const volume = document.getElementById("volume");
const fullscreen = document.getElementById("fullscreen");

// Play / Pause toggle
playPause.addEventListener("click", () => {
  if (video.paused) {
    video.play();
    playPause.textContent = "⏸";
  } else {
    video.pause();
    playPause.textContent = "▶";
  }
});

// Update progress bar
video.addEventListener("timeupdate", () => {
  progress.value = (video.currentTime / video.duration) * 100;
});

// Seek video
progress.addEventListener("input", () => {
  video.currentTime = (progress.value * video.duration) / 100;
});

// Mute / Unmute
mute.addEventListener("click", () => {
  video.muted = !video.muted;
  mute.textContent = video.muted ? "🔇" : "🔊";
});

// Volume control
volume.addEventListener("input", () => {
  video.volume = volume.value;
});

// Fullscreen
fullscreen.addEventListener("click", () => {
  if (video.requestFullscreen) video.requestFullscreen();
});

  </script>
</body>
</html>
